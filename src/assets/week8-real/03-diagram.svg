<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="44" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">인간의 비판적 검토와 최종 의사결정</text>

  <!-- 사용자 아이콘 (상단) -->
  <g transform="translate(400, 140)">
    <circle cx="0" cy="-20" r="25" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2.5"></circle>
    <path d="M -40,40 Q -40,10 0,10 Q 40,10 40,40" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2.5"></path>
    <text y="65" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#0a0a0a">의사결정자 (전문가)</text>
  </g>

  <!-- AI 제안 옵션들 -->
  <g transform="translate(0, 360)">
    <!-- 옵션 1 -->
    <g transform="translate(180, 0)">
      <rect id="opt1" x="-70" y="-40" width="140" height="80" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"></rect>
      <text y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">AI 제안 A</text>
    </g>
    
    <!-- 옵션 2 (선택될 옵션) -->
    <g transform="translate(400, 0)">
      <rect id="opt2" x="-70" y="-40" width="140" height="80" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="2">
        <animate id="select_color" attributeName="stroke" from="#e5e5e5" to="#2563eb" dur="0.5s" begin="4.5s;loop.end" fill="freeze"></animate>
        <animate attributeName="stroke-width" from="2" to="4" dur="0.5s" begin="4.5s;loop.end" fill="freeze"></animate>
      </rect>
      <text y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">
        AI 제안 B
        <animate attributeName="fill" from="#737373" to="#2563eb" dur="0.5s" begin="4.5s;loop.end" fill="freeze"></animate>
      </text>
      
      <!-- 최종 서명 스탬프 -->
      <g id="stamp" opacity="0" transform="translate(0, 0) rotate(-15)">
        <rect x="-55" y="-20" width="110" height="40" rx="4" fill="none" stroke="#e11d48" stroke-width="3"></rect>
        <text y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#e11d48">사용자 서명</text>
        <animate id="stamp_appear" attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.2s;loop.end" fill="freeze"></animate>
        <animate attributeName="transform" type="scale" from="1.5" to="1" dur="0.3s" begin="5.2s;loop.end" additive="sum"></animate>
      </g>
    </g>

    <!-- 옵션 3 -->
    <g transform="translate(620, 0)">
      <rect id="opt3" x="-70" y="-40" width="140" height="80" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"></rect>
      <text y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">AI 제안 C</text>
    </g>
  </g>

  <!-- 돋보기 (비판적 사고 메타포) -->
  <g id="magnifier">
    <circle cx="0" cy="0" r="35" fill="rgba(37, 99, 235, 0.1)" stroke="#2563eb" stroke-width="3"></circle>
    <line x1="25" y1="25" x2="45" y2="45" stroke="#2563eb" stroke-width="6" stroke-linecap="round"></line>
    <text y="-50" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" fill="#2563eb">비판적 검토</text>
    
    <animateMotion id="loop" path="M 180,360 L 400,360 L 620,360 L 400,360" dur="5s" begin="0.5s;stamp_appear.end + 2s" fill="freeze" keyTimes="0; 0.3; 0.6; 0.9; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"></animateMotion>
    
    <animate attributeName="opacity" from="1" to="0" dur="0.3s" begin="4.5s;loop.end" fill="freeze"></animate>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.5s;loop.end + 2s" fill="freeze"></animate>
  </g>

  <!-- 하단 설명 라벨 -->
  <g transform="translate(400, 520)">
    <rect x="-150" y="-20" width="300" height="40" rx="20" fill="#0a0a0a"></rect>
    <text y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#ffffff">최종 결정과 책임은 인간에게 있습니다</text>
  </g>

  <!-- 초기화 애니메이션 (루프용) -->
  </svg>