<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="44" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">신용 평가의 진화: 주관에서 AI까지</text>

  <!-- 타임라인 메인 라인 -->
  <line x1="80" y1="480" x2="720" y2="480" stroke="#e5e5e5" stroke-width="4" stroke-linecap="round"></line>
  <line x1="80" y1="480" x2="720" y2="480" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-dasharray="640" stroke-dashoffset="640">
    <animate attributeName="stroke-dashoffset" from="640" to="0" dur="4s" fill="freeze"></animate>
  </line>

  <!-- 1단계: 중세 상인 (주관적 판단) -->
  <g transform="translate(160, 320)">
    <!-- 장부 -->
    <rect x="-50" y="-40" width="100" height="120" rx="4" fill="#f5f5f4" stroke="#737373" stroke-width="2"></rect>
    <line x1="-35" y1="-20" x2="35" y2="-20" stroke="#e5e5e5" stroke-width="2"></line>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#e5e5e5" stroke-width="2"></line>
    <line x1="-35" y1="20" x2="35" y2="20" stroke="#e5e5e5" stroke-width="2"></line>
    <line x1="-35" y1="40" x2="35" y2="40" stroke="#e5e5e5" stroke-width="2"></line>
    
    <!-- 깃펜 -->
    <g>
      <path d="M10,10 L40,-40 C45,-45 55,-35 50,-30 L20,20 Z" fill="#737373"></path>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-5; 0,0" dur="2s" repeatCount="indefinite"></animateTransform>
    </g>
    
    <text y="110" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#0a0a0a">중세: 주관적 판단</text>
    <text y="135" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">상인의 경험과 직관</text>
    
    <circle cx="0" cy="160" r="6" fill="#7c3aed"></circle>
  </g>

  <!-- 2단계: 근대 통계 (모델과 데이터) -->
  <g transform="translate(400, 320)">
    <rect x="-60" y="-50" width="120" height="140" rx="8" fill="#f5f5f4" stroke="#737373" stroke-width="2"></rect>
    <!-- 계산기 버튼들 -->
    <rect x="-45" y="20" width="20" height="15" rx="2" fill="#e5e5e5"></rect>
    <rect x="-10" y="20" width="20" height="15" rx="2" fill="#e5e5e5"></rect>
    <rect x="25" y="20" width="20" height="15" rx="2" fill="#e5e5e5"></rect>
    <rect x="-45" y="45" width="20" height="15" rx="2" fill="#e5e5e5"></rect>
    <rect x="-10" y="45" width="20" height="15" rx="2" fill="#e5e5e5"></rect>
    <rect x="25" y="45" width="20" height="15" rx="2" fill="#7c3aed"></rect>
    
    <!-- 그래프 -->
    <path d="M-45,0 L-15,-20 L15,-10 L45,-40" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="150" stroke-dashoffset="150">
      <animate attributeName="stroke-dashoffset" from="150" to="0" begin="1.5s" dur="2s" fill="freeze"></animate>
    </path>

    <text y="110" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#0a0a0a">근대: 통계 및 모델</text>
    <text y="135" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">스코어링 시스템 도입</text>
    
    <circle cx="0" cy="160" r="6" fill="#7c3aed"></circle>
  </g>

  <!-- 3단계: 현대 AI (데이터 스트림) -->
  <g transform="translate(640, 320)">
    <!-- AI 뇌 아이콘 -->
    <path d="M-30,0 C-30,-40 30,-40 30,0 C30,30 10,40 0,40 C-10,40 -30,30 -30,0" fill="none" stroke="#7c3aed" stroke-width="3">
      <animate attributeName="stroke-width" values="3;5;3" dur="2s" repeatCount="indefinite"></animate>
    </path>
    <circle cx="0" cy="0" r="15" fill="#7c3aed" opacity="0.2">
      <animate attributeName="r" values="15;25;15" dur="2s" repeatCount="indefinite"></animate>
    </circle>

    <!-- 데이터 흐름 입자 -->
    <circle r="3" fill="#7c3aed">
      <animateMotion path="M-50,-50 Q0,-80 50,-50" dur="1.5s" repeatCount="indefinite"></animateMotion>
    </circle>
    <circle r="3" fill="#7c3aed">
      <animateMotion path="M-60,0 Q0,20 60,0" dur="2s" repeatCount="indefinite"></animateMotion>
    </circle>
    <circle r="3" fill="#7c3aed">
      <animateMotion path="M-50,50 Q0,80 50,50" dur="1.8s" repeatCount="indefinite"></animateMotion>
    </circle>

    <text y="110" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#0a0a0a">현대: AI 데이터 분석</text>
    <text y="135" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">실시간 비정형 데이터</text>
    
    <circle cx="0" cy="160" r="6" fill="#7c3aed"></circle>
  </g>
</svg>