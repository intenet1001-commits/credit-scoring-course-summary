<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="60" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#0a0a0a">정보 비대칭: 숨겨진 진실과 대출 결정</text>

  <!-- 정보 비대칭 설명 라벨 -->
  <text x="400" y="100" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#737373">차입자는 정보를 숨기고, 대출자는 불확실성 속에 망설입니다.</text>

  <!-- [요소 1] 숨겨진 보물상자 (실제 재무 상태) -->
  <g transform="translate(220, 380)">
    <rect x="0" y="0" width="80" height="60" rx="4" fill="#e5e5e5" stroke="#0a0a0a" stroke-width="2"></rect>
    <path d="M 0 20 L 80 20" stroke="#0a0a0a" stroke-width="2"></path>
    <circle cx="40" cy="35" r="6" fill="#059669"></circle>
    <text x="40" y="85" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#059669">실제 재무 상태</text>
    
    <!-- 숨겨진 정보 강조 애니메이션 -->
    <rect x="-5" y="-5" width="90" height="70" rx="6" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"></animate>
    </rect>
  </g>

  <!-- [요소 2] 차입자 (Borrower) -->
  <g transform="translate(300, 350)">
    <!-- 몸체 -->
    <path d="M -30 80 L 30 80 L 20 0 L -20 0 Z" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"></path>
    <!-- 머리 -->
    <circle cx="0" cy="-30" r="25" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"></circle>
    <!-- 팔 (뒤로 숨기는 자세) -->
    <path d="M -20 20 Q -40 40 -50 60" fill="none" stroke="#0a0a0a" stroke-width="2"></path>
    <text x="0" y="110" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#0a0a0a">차입자</text>
  </g>

  <!-- [요소 3] 대출자 / 은행 (Lender) -->
  <g transform="translate(550, 350)">
    <!-- 은행 건물 형상 -->
    <path d="M -60 80 L 60 80 L 60 0 L 0 -40 L -60 0 Z" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"></path>
    <rect x="-40" y="20" width="20" height="20" fill="#e5e5e5" stroke="#0a0a0a"></rect>
    <rect x="20" y="20" width="20" height="20" fill="#e5e5e5" stroke="#0a0a0a"></rect>
    <rect x="-15" y="40" width="30" height="40" fill="#e5e5e5" stroke="#0a0a0a"></rect>
    <text x="0" y="110" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#0a0a0a">대출자 (은행)</text>

    <!-- 물음표 (불확실성) -->
    <g transform="translate(0, -80)">
      <text x="0" y="0" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="48" font-weight="700" fill="#737373">?
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"></animate>
        <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="2s" repeatCount="indefinite"></animateTransform>
      </text>
    </g>
  </g>

  <!-- [요소 4] 대출금 (Money Bag) -->
  <g transform="translate(460, 360)">
    <path d="M -20 20 C -20 -10 20 -10 20 20 C 20 40 -20 40 -20 20" fill="#059669" stroke="#0a0a0a" stroke-width="2"></path>
    <path d="M -10 0 L 10 0" stroke="#0a0a0a" stroke-width="2"></path>
    <text x="0" y="15" fill="white" font-size="14" font-weight="700" text-anchor="middle">₩</text>
    <text x="0" y="55" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#059669">대출 실행 여부</text>

    <!-- 망설이는 움직임 -->
    <animateTransform attributeName="transform" type="translate" values="460,360; 440,360; 460,360" dur="4s" repeatCount="indefinite"></animateTransform>
  </g>

  <!-- 정보의 흐름 차단 시각화 -->
  <line x1="360" y1="350" x2="480" y2="350" stroke="#737373" stroke-width="2" stroke-dasharray="8 4"></line>
  <rect x="410" y="335" width="20" height="30" fill="#0a0a0a"></rect>
  <text x="420" y="320" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#737373">정보 차단</text>

</svg>