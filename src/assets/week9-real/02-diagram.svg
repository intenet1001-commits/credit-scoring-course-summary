<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>
  
  <!-- 제목 -->
  <text x="400" y="44" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">AI 대출 자동 심사와 인간의 개입 (HITL)</text>

  <!-- 컨베이어 벨트 구조 -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="600" height="20" rx="10" fill="#e5e5e5"></rect>
    <!-- 롤러들 -->
    <circle cx="30" cy="10" r="8" fill="#737373">
      <animateTransform attributeName="transform" type="rotate" from="0 30 10" to="360 30 10" dur="2s" repeatCount="indefinite" end="stopTrigger.begin"></animateTransform>
    </circle>
    <circle cx="130" cy="10" r="8" fill="#737373">
      <animateTransform attributeName="transform" type="rotate" from="0 130 10" to="360 130 10" dur="2s" repeatCount="indefinite" end="stopTrigger.begin"></animateTransform>
    </circle>
    <circle cx="230" cy="10" r="8" fill="#737373">
      <animateTransform attributeName="transform" type="rotate" from="0 230 10" to="360 230 10" dur="2s" repeatCount="indefinite" end="stopTrigger.begin"></animateTransform>
    </circle>
    <circle cx="330" cy="10" r="8" fill="#737373">
      <animateTransform attributeName="transform" type="rotate" from="0 330 10" to="360 330 10" dur="2s" repeatCount="indefinite" end="stopTrigger.begin"></animateTransform>
    </circle>
    <circle cx="430" cy="10" r="8" fill="#737373">
      <animateTransform attributeName="transform" type="rotate" from="0 430 10" to="360 430 10" dur="2s" repeatCount="indefinite" end="stopTrigger.begin"></animateTransform>
    </circle>
    <circle cx="530" cy="10" r="8" fill="#737373">
      <animateTransform attributeName="transform" type="rotate" from="0 530 10" to="360 530 10" dur="2s" repeatCount="indefinite" end="stopTrigger.begin"></animateTransform>
    </circle>
    <text x="300" y="50" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">자동화 컨베이어 시스템</text>
  </g>

  <!-- 대출 신청서들 -->
  <g id="forms">
    <!-- 신청서 1 (이미 지나감) -->
    <g transform="translate(550, 340)">
      <rect width="80" height="100" fill="white" stroke="#e5e5e5" stroke-width="2"></rect>
      <rect x="10" y="15" width="60" height="5" fill="#f5f5f4"></rect>
      <rect x="10" y="30" width="40" height="5" fill="#f5f5f4"></rect>
      <text x="40" y="70" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#059669">승인</text>
      <animateTransform attributeName="transform" type="translate" from="550 340" to="850 340" dur="2s" begin="0s" fill="freeze" end="stopTrigger.begin"></animateTransform>
    </g>

    <!-- 신청서 2 (심사 대상) -->
    <g transform="translate(150, 340)">
      <rect width="80" height="100" fill="white" stroke="#e5e5e5" stroke-width="2"></rect>
      <rect x="10" y="15" width="60" height="5" fill="#f5f5f4"></rect>
      <rect x="10" y="30" width="40" height="5" fill="#f5f5f4"></rect>
      <text x="40" y="60" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#737373">신청서</text>
      
      <!-- 이동 애니메이션 -->
      <animateTransform id="formMove" attributeName="transform" type="translate" from="150 340" to="360 340" dur="2s" begin="0s" fill="freeze"></animateTransform>
      
      <!-- 스탬프 결과 (승인) -->
      <text x="40" y="85" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#059669" opacity="0">
        승인
        <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.5s" fill="freeze"></animate>
      </text>
      
      <!-- 다시 이동 -->
      <animateTransform attributeName="transform" type="translate" from="360 340" to="550 340" dur="2s" begin="3s" fill="freeze" end="stopTrigger.begin"></animateTransform>
    </g>

    <!-- 신청서 3 (중단될 신청서) -->
    <g transform="translate(-50, 340)">
      <rect width="80" height="100" fill="white" stroke="#e5e5e5" stroke-width="2"></rect>
      <rect x="10" y="15" width="60" height="5" fill="#f5f5f4"></rect>
      <rect x="10" y="30" width="40" height="5" fill="#f5f5f4"></rect>
      <text x="40" y="60" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#737373">신청서</text>
      
      <animateTransform attributeName="transform" type="translate" from="-50 340" to="360 340" dur="3s" begin="2s" fill="freeze" end="stopTrigger.begin"></animateTransform>
    </g>
  </g>

  <!-- AI 로봇 팔 -->
  <g transform="translate(400, 100)">
    <!-- 베이스 -->
    <rect x="-40" y="0" width="80" height="20" fill="#737373"></rect>
    <!-- 팔 관절 -->
    <g>
      <rect x="-5" y="20" width="10" height="100" fill="#2563eb"></rect>
      <circle cx="0" cy="120" r="15" fill="#2563eb"></circle>
      <rect x="-5" y="120" width="10" height="80" fill="#2563eb"></rect>
      
      <!-- 스탬프 헤드 -->
      <g transform="translate(0, 200)">
        <rect x="-20" y="0" width="40" height="15" fill="#0a0a0a"></rect>
        <rect x="-15" y="15" width="30" height="10" fill="#737373"></rect>
        
        <!-- 스탬핑 동작 -->
        <animateTransform id="stampAnim" attributeName="transform" type="translate" values="0 200; 0 240; 0 200" keyTimes="0; 0.5; 1" dur="0.6s" begin="2.2s" fill="freeze"></animateTransform>
        <animateTransform attributeName="transform" type="translate" values="0 200; 0 240; 0 200" keyTimes="0; 0.5; 1" dur="0.6s" begin="5.2s" fill="freeze" end="stopTrigger.begin"></animateTransform>
      </g>
    </g>
    <text x="80" y="60" text-anchor="start" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" fill="#2563eb">AI 자동 심사관</text>
  </g>

  <!-- 인간의 개입 요소 (초기엔 숨김) -->
  <g id="humanIntervention">
    <!-- 중단 트리거 -->
    <rect id="stopTrigger" x="0" y="0" width="1" height="1" opacity="0">
      <animate attributeName="x" from="0" to="1" dur="0.1s" begin="5.5s" fill="freeze"></animate>
    </rect>

    <!-- 인간의 손 -->
    <g transform="translate(800, 500)">
      <path d="M-100,0 C-80,-20 -60,-40 -20,-40 L20,-40 L20,40 L-20,40 C-60,40 -80,20 -100,0" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"></path>
      <path d="M-40,-20 L-10,-20 M-40,0 L-10,0 M-40,20 L-10,20" stroke="#0a0a0a" stroke-width="2"></path>
      <animateTransform attributeName="transform" type="translate" from="800 500" to="550 430" dur="0.5s" begin="5.5s" fill="freeze"></animateTransform>
      <text x="-30" y="60" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#ea580c">인간의 개입</text>
    </g>

    <!-- 인간의 눈 (감시/검토 아이콘) -->
    <g transform="translate(400, 280)" opacity="0">
      <path d="M-40,0 Q0,-30 40,0 Q0,30 -40,0 Z" fill="none" stroke="#ea580c" stroke-width="3"></path>
      <circle cx="0" cy="0" r="12" fill="#ea580c"></circle>
      <text y="50" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#ea580c">이상 탐지 및 검토 중</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="6s" fill="freeze"></animate>
    </g>
  </g>

  <!-- 상태 라벨 -->
  <rect x="40" y="520" width="720" height="40" rx="8" fill="#f5f5f4"></rect>
  <text x="400" y="545" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" fill="#737373">
    <tspan x="400">상태: </tspan>
    <tspan font-weight="700" fill="#2563eb">AI 자동 처리 중...</tspan>
    <animate attributeName="fill" values="#2563eb;#ea580c" dur="0.1s" begin="5.5s" fill="freeze"></animate>
    <set attributeName="textContent" value="상태: 인간 검토 대기 중 (Human-in-the-Loop)" begin="5.5s"></set>
  </text>
</svg>