<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="48" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">AI 활용과 인권의 균형 및 보호</text>

  <!-- 시소 받침대 -->
  <polygon points="376,480 424,480 400,432" fill="#0a0a0a"></polygon>

  <!-- 시소 판 -->
  <rect x="160" y="424" width="480" height="8" rx="4" fill="#737373"></rect>

  <!-- 왼쪽: AI 허용 영역 -->
  <g transform="translate(192, 360)">
    <rect width="128" height="64" rx="8" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"></rect>
    <!-- AI 아이콘 (칩 형태) -->
    <rect x="12" y="22" width="20" height="20" rx="2" fill="#e5e5e5" stroke="#737373" stroke-width="1.5"></rect>
    <line x1="22" y1="18" x2="22" y2="22" stroke="#737373" stroke-width="1.5"></line>
    <line x1="22" y1="42" x2="22" y2="46" stroke="#737373" stroke-width="1.5"></line>
    <line x1="8" y1="32" x2="12" y2="32" stroke="#737373" stroke-width="1.5"></line>
    <line x1="32" y1="32" x2="36" y2="32" stroke="#737373" stroke-width="1.5"></line>
    <text x="82" y="32" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#0a0a0a">AI 허용</text>
  </g>

  <!-- 오른쪽: 기본권 보호 영역 -->
  <g transform="translate(480, 360)">
    <rect width="128" height="64" rx="8" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"></rect>
    <!-- 인권 아이콘 (사람 형태) -->
    <circle cx="24" cy="26" r="6" fill="#e5e5e5" stroke="#737373" stroke-width="1.5"></circle>
    <path d="M14,44 Q24,34 34,44" fill="none" stroke="#737373" stroke-width="1.5"></path>
    <text x="82" y="32" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#0a0a0a">기본권 보호</text>
  </g>

  <!-- 스포트라이트 효과 -->
  <path d="M544,80 L440,432 L648,432 Z" fill="#2563eb" opacity="0">
    <animate attributeName="opacity" from="0" to="0.1" dur="1s" begin="1.5s" fill="freeze"></animate>
  </path>

  <!-- 방패 아이콘 (고위험 AI 보호) -->
  <g transform="translate(544, 280)" opacity="0">
    <path d="M0,-32 L24,-20 L24,12 C24,32 0,44 0,44 C0,44 -24,32 -24,12 L-24,-20 Z" fill="#2563eb"></path>
    <path d="M-12,0 L-4,8 L12,-8" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.5s" fill="freeze"></animate>
    <animateTransform attributeName="transform" type="translate" from="544, 250" to="544, 280" dur="0.8s" begin="2.5s" fill="freeze"></animateTransform>
  </g>

  <!-- 특별 보호 라벨 -->
  <g opacity="0">
    <rect x="444" y="190" width="200" height="40" rx="20" fill="#2563eb"></rect>
    <text x="544" y="210" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" fill="#ffffff">고위험 AI 특별 보호</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.3s" fill="freeze"></animate>
  </g>

  <!-- 하단 설명 텍스트 -->
  <text x="400" y="540" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">유연한 균형을 유지하되, 고위험 AI에는 강력한 보호 장치 적용</text>
</svg>