<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="60" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="26" font-weight="700" fill="#0a0a0a">AI 공정성 및 비차별성 원칙</text>

  <!-- 저울 지지대 -->
  <path d="M370 520 L430 520 L400 420 Z" fill="#e5e5e5" stroke="#737373" stroke-width="2"></path>
  <circle cx="400" cy="420" r="6" fill="#737373"></circle>

  <!-- 저울 전체 시스템 (회전 애니메이션 중심) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 400 420; 15 400 420; 15 400 420; 0 400 420; 0 400 420" dur="6s" repeatCount="indefinite"></animateTransform>

    <!-- 가로 빔 -->
    <line x1="180" y1="420" x2="620" y2="420" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"></line>

    <!-- 왼쪽 접시 (사람들) -->
    <g transform="translate(180, 420)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#737373" stroke-width="2"></line>
      <path d="M-80 60 L80 60 Q0 100 -80 60" fill="#f5f5f4" stroke="#737373" stroke-width="2"></path>
      
      <!-- 다양한 사람들 메타포 -->
      <circle cx="-40" cy="40" r="12" fill="#fbbf24"></circle> <!-- 아동/청년 -->
      <circle cx="-10" cy="35" r="14" fill="#60a5fa"></circle> <!-- 성인 -->
      <circle cx="20" cy="42" r="11" fill="#f87171"></circle> <!-- 여성 -->
      <circle cx="45" cy="38" r="13" fill="#4ade80"></circle> <!-- 노인 -->
      
      <text x="0" y="115" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#0a0a0a">다양한 사용자 그룹</text>
      
      <!-- 초록색 체크마크 (공정성 승인) -->
      <g opacity="0">
        <path d="M-15 0 L-5 10 L15 -10" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
        <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite"></animate>
      </g>
    </g>

    <!-- 오른쪽 접시 (AI 로봇) -->
    <g transform="translate(620, 420)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#737373" stroke-width="2"></line>
      <path d="M-80 60 L80 60 Q0 100 -80 60" fill="#f5f5f4" stroke="#737373" stroke-width="2"></path>
      
      <!-- AI 로봇 아이콘 -->
      <rect x="-25" y="10" width="50" height="40" rx="4" fill="#7c3aed"></rect>
      <circle cx="-10" cy="25" r="4" fill="white">
        <animate attributeName="fill" values="white;#ef4444;white" dur="2s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="10" cy="25" r="4" fill="white">
        <animate attributeName="fill" values="white;#ef4444;white" dur="2s" repeatCount="indefinite"></animate>
      </circle>
      <path d="M-10 40 Q0 45 10 40" fill="none" stroke="white" stroke-width="2"></path>
      
      <text x="0" y="115" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#0a0a0a">AI 편향적 의사결정</text>

      <!-- 빨간색 X (차별 경고) -->
      <g opacity="0">
        <line x1="-15" y1="-15" x2="15" y2="15" stroke="#ef4444" stroke-width="6" stroke-linecap="round"></line>
        <line x1="15" y1="-15" x2="-15" y2="15" stroke="#ef4444" stroke-width="6" stroke-linecap="round"></line>
        <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite"></animate>
      </g>
    </g>
  </g>

  <!-- 하단 설명 텍스트 -->
  <rect x="150" y="540" width="500" height="40" rx="20" fill="#f5f5f4" stroke="#e5e5e5"></rect>
  <text x="400" y="565" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="15" fill="#737373">
    <tspan x="400" dy="0">AI는 특정 집단을 차별하지 않고 모든 사용자에게 공정한 결과를 제공해야 합니다.</tspan>
  </text>

  <!-- 가이드 라인 (수평 기준선) -->
  <line x1="100" y1="420" x2="700" y2="420" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="4 4"></line>
</svg>