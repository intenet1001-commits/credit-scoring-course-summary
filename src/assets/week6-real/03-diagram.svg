<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="44" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">
    마스터 스케일을 통한 데이터 표준화
  </text>

  <!-- 마스터 스케일 (표준 자) -->
  <g id="master-scale" opacity="0">
    <rect x="100" y="100" width="600" height="40" rx="4" fill="#f5f5f4" stroke="#737373" stroke-width="2"></rect>
    <!-- 눈금 -->
    <path d="M 150 100 V 115 M 200 100 V 110 M 250 100 V 115 M 300 100 V 110 M 350 100 V 115 M 400 100 V 125 M 450 100 V 115 M 500 100 V 110 M 550 100 V 115 M 600 100 V 110 M 650 100 V 115" stroke="#737373" stroke-width="1.5"></path>
    <text x="400" y="80" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#0a0a0a">마스터 스케일 (표준 지표)</text>
    <text x="400" y="155" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#2563eb">표준 'Hot' 레벨</text>
    
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" begin="0s"></animate>
  </g>

  <!-- 모델 1 온도계 -->
  <g id="model-1" transform="translate(200, 480)">
    <path d="M -15 -150 V -30 A 20 20 0 1 0 15 -30 V -150 Z" fill="#f5f5f4" stroke="#737373" stroke-width="2"></path>
    <circle cx="0" cy="-25" r="12" fill="#2563eb"></circle>
    <!-- 수은주 (80점 수준) -->
    <rect x="-6" y="-110" width="12" height="85" rx="6" fill="#2563eb">
      <animate attributeName="height" from="0" to="85" dur="1s" fill="freeze" begin="1s"></animate>
      <animate attributeName="y" from="-25" to="-110" dur="1s" fill="freeze" begin="1s"></animate>
    </rect>
    <text x="0" y="35" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#737373">모델 1 (측정치: 80)</text>
    <animate transform="translate(200, 520)" attributeName="transform" type="translate" from="200, 520" to="200, 480" dur="0.8s" fill="freeze" begin="0.5s"></animate>
  </g>

  <!-- 모델 2 온도계 -->
  <g id="model-2" transform="translate(600, 480)">
    <path d="M -15 -150 V -30 A 20 20 0 1 0 15 -30 V -150 Z" fill="#f5f5f4" stroke="#737373" stroke-width="2"></path>
    <circle cx="0" cy="-25" r="12" fill="#2563eb"></circle>
    <!-- 수은주 (120점 수준) -->
    <rect x="-6" y="-140" width="12" height="115" rx="6" fill="#2563eb">
      <animate attributeName="height" from="0" to="115" dur="1s" fill="freeze" begin="1.2s"></animate>
      <animate attributeName="y" from="-25" to="-140" dur="1s" fill="freeze" begin="1.2s"></animate>
    </rect>
    <text x="0" y="35" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#737373">모델 2 (측정치: 120)</text>
    <animate transform="translate(600, 520)" attributeName="transform" type="translate" from="600, 520" to="600, 480" dur="0.8s" fill="freeze" begin="0.7s"></animate>
  </g>

  <!-- 매핑 화살표 1 -->
  <path id="arrow-1" d="M 200 370 Q 200 250 390 145" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 4" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.5s" fill="freeze" begin="2.2s"></animate></path></svg>