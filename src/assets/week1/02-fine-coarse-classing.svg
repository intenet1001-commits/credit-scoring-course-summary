<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="44" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">데이터 모델링: 요리사의 재료 준비 과정</text>

  <!-- 조리대 (구조선) -->
  <line x1="100" y1="480" x2="700" y2="480" stroke="#e5e5e5" stroke-width="4" stroke-linecap="round"></line>

  <!-- 1단계: 원천 데이터 (Raw Data) -->
  <g id="raw-data">
    <path d="M360 320 L440 320 L420 240 L380 240 Z" fill="#737373" opacity="0">
      <animate attributeName="opacity" from="0" to="0.6" dur="1s" begin="0s" fill="freeze"></animate>
      <animate attributeName="opacity" from="0.6" to="0" dur="0.5s" begin="2s" fill="freeze"></animate>
    </path>
    <text x="400" y="340" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#737373" opacity="0">
      원천 데이터 (Raw Data)
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0s" fill="freeze"></animate>
      <animate attributeName="opacity" from="1" to="0" dur="0.5s" begin="2s" fill="freeze"></animate>
    </text>
  </g>

  <!-- 2단계: 세밀한 분류 (Fine Classing) - 칼질 애니메이션 -->
  <g id="chopping">
    <rect id="knife" x="300" y="200" width="10" height="80" fill="#737373" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.5s" fill="freeze"></animate>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="180,0" dur="1s" begin="1.7s" fill="freeze"></animateTransform>
      <animate attributeName="opacity" from="1" to="0" dur="0.2s" begin="2.8s" fill="freeze"></animate>
    </rect>
    <text x="400" y="180" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500" fill="#2563eb" opacity="0">
      세밀한 분류 (Fine Classing)
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"></animate>
      <animate attributeName="opacity" from="1" to="0" dur="0.5s" begin="3.5s" fill="freeze"></animate>
    </text>
  </g>

  <!-- 3단계: 그룹화 (Coarse Classing) - 그릇들 -->
  <g id="bowls" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="3s" fill="freeze"></animate>
    <!-- 그릇 1 -->
    <path d="M160 480 Q160 520 240 520 Q320 520 320 480" fill="none" stroke="#e5e5e5" stroke-width="3"></path>
    <text x="240" y="540" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">그룹 A</text>
    <!-- 그릇 2 (핵심) -->
    <path d="M360 480 Q360 520 440 520 Q520 520 520 480" fill="none" stroke="#e5e5e5" stroke-width="3"></path>
    <text x="440" y="540" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">그룹 B</text>
    <!-- 그릇 3 -->
    <path d="M560 480 Q560 520 640 520 Q720 520 720 480" fill="none" stroke="#e5e5e5" stroke-width="3"></path>
    <text x="640" y="540" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">그룹 C</text>
  </g>

  <!-- 재료 입자들 (움직이는 요소) -->
  <g id="ingredients">
    <!-- 입자 1 -> 그릇 A -->
    <rect width="12" height="12" fill="#2563eb" x="380" y="280" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2s" fill="freeze"></animate>
      <animate attributeName="x" from="380" to="220" dur="1.5s" begin="3.5s" fill="freeze"></animate>
      <animate attributeName="y" from="280" to="470" dur="1.5s" begin="3.5s" fill="freeze"></animate>
    </rect>
    <!-- 입자 2 -> 그릇 B -->
    <rect width="12" height="12" fill="#2563eb" x="400" y="280" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.2s" fill="freeze"></animate>
      <animate attributeName="x" from="400" to="434" dur="1.5s" begin="3.5s" fill="freeze"></animate>
      <animate attributeName="y" from="280" to="470" dur="1.5s" begin="3.5s" fill="freeze"></animate>
    </rect>
    <!-- 입자 3 -> 그릇 C -->
    <rect width="12" height="12" fill="#2563eb" x="420" y="280" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.4s" fill="freeze"></animate>
      <animate attributeName="x" from="420" to="630" dur="1.5s" begin="3.5s" fill="freeze"></animate>
      <animate attributeName="y" from="280" to="470" dur="1.5s" begin="3.5s" fill="freeze"></animate>
    </rect>
  </g>

  <!-- 4단계: WOE 및 IV (Spotlight) -->
  <g id="evaluation" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="5.5s" fill="freeze"></animate>
    <!-- 스포트라이트 효과 -->
    <circle cx="440" cy="480" r="60" fill="#2563eb" opacity="0.1">
      <animate attributeName="r" values="60;70;60" dur="2s" repeatCount="indefinite"></animate>
    </circle>
    
    <!-- WOE 라벨 -->
    <rect x="360" y="360" width="160" height="32" rx="16" fill="#2563eb"></rect>
    <text x="440" y="377" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#ffffff">WOE: 맛의 기여도</text>
    
    <!-- IV 라벨 -->
    <rect x="360" y="400" width="160" height="32" rx="16" fill="#0a0a0a"></rect>
    <text x="440" y="417" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#ffffff">IV: 전체적 가치</text>

    <!-- 설명 텍스트 -->
    <text x="440" y="330" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#2563eb">변수 영향력 평가</text>
  </g>

  <!-- 하단 캡션 -->
  <text x="400" y="580" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">데이터를 잘게 썰고(Fine) 묶어서(Coarse) 최적의 맛(IV)을 찾아냅니다.</text>
</svg>