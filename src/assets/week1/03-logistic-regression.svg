<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="44" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">
    로지스틱 회귀: 투명한 신용 평가 레시피
  </text>

  <!-- 레시피 북 (왼쪽) -->
  <g transform="translate(60, 120)">
    <rect width="300" height="400" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"></rect>
    <line x1="150" y1="20" x2="150" y2="380" stroke="#e5e5e5" stroke-width="1"></line>
    <text x="75" y="50" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#737373">재료 (데이터)</text>
    
    <!-- 재료 리스트 -->
    <g id="ing1_static" transform="translate(40, 100)">
      <circle cx="0" cy="0" r="15" fill="#f5f5f4" stroke="#737373" stroke-width="1.5"></circle>
      <text x="50" y="2" text-anchor="start" font-family="'Pretendard', sans-serif" font-size="14" fill="#0a0a0a">연간 소득</text>
    </g>
    <g id="ing2_static" transform="translate(40, 160)">
      <circle cx="0" cy="0" r="15" fill="#f5f5f4" stroke="#737373" stroke-width="1.5"></circle>
      <text x="50" y="2" text-anchor="start" font-family="'Pretendard', sans-serif" font-size="14" fill="#0a0a0a">기존 부채</text>
    </g>
    <g id="ing3_static" transform="translate(40, 220)">
      <circle cx="0" cy="0" r="15" fill="#f5f5f4" stroke="#737373" stroke-width="1.5"></circle>
      <text x="50" y="2" text-anchor="start" font-family="'Pretendard', sans-serif" font-size="14" fill="#0a0a0a">연령/경력</text>
    </g>
  </g>

  <!-- 요리 과정 (중앙) -->
  <g transform="translate(400, 300)">
    <!-- 믹싱 볼 (모델) -->
    <path d="M -80,0 Q -80,80 0,80 Q 80,80 80,0 Z" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="-2 0 40; 2 0 40; -2 0 40" dur="1s" repeatCount="indefinite" begin="4.5s"></animateTransform>
    </path>
    <text x="0" y="110" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#2563eb">로지스틱 모델 (Chef)</text>
    <text x="0" y="40" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="12" fill="#737373">가중치 합산 &amp; 변환</text>

    <!-- 요리사 모자 아이콘 -->
    <path d="M -20,-30 Q -30,-60 0,-60 Q 30,-60 20,-30 Z" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"></path>
  </g>

  <!-- 움직이는 재료들 -->
  <!-- 소득 (긍정적 영향) -->
  <g>
    <circle r="12" fill="#2563eb" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s; 6s" repeatCount="indefinite"></animate>
      <animateMotion path="M 100,220 Q 250,220 400,300" dur="2s" begin="0.5s; 6s" repeatCount="indefinite"></animateMotion>
    </circle>
    <text font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#2563eb" opacity="0">
      + 가중치
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s; 6s" repeatCount="indefinite"></animate>
      <animateMotion path="M 100,200 Q 250,200 400,280" dur="2s" begin="0.5s; 6s" repeatCount="indefinite"></animateMotion>
    </text>
  </g>

  <!-- 부채 (부정적 영향) -->
  <g>
    <circle r="12" fill="#737373" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.5s; 7s" repeatCount="indefinite"></animate>
      <animateMotion path="M 100,280 Q 250,280 400,300" dur="2s" begin="1.5s; 7s" repeatCount="indefinite"></animateMotion>
    </circle>
    <text font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#737373" opacity="0">
      - 가중치
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.5s; 7s" repeatCount="indefinite"></animate>
      <animateMotion path="M 100,260 Q 250,260 400,280" dur="2s" begin="1.5s; 7s" repeatCount="indefinite"></animateMotion>
    </text>
  </g>

  <!-- 결과물 (오른쪽) -->
  <g transform="translate(650, 300)">
    <ellipse cx="0" cy="50" rx="80" ry="30" fill="#e5e5e5"></ellipse>
    <rect x="-50" y="-60" width="100" height="80" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="5s" fill="freeze"></animate>
      <animate attributeName="y" values="-40;-60" dur="0.5s" begin="5s" fill="freeze"></animate>
    </rect>
    <text x="0" y="-35" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#2563eb" opacity="0">
      신용 점수
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="5.2s" fill="freeze"></animate>
    </text>
    <text x="0" y="-10" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#0a0a0a" opacity="0">
      850
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="5.4s" fill="freeze"></animate>
    </text>
    <text x="0" y="100" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">최종 결과 (해석 가능)</text>
  </g>

  <!-- 설명 라벨 -->
  <g transform="translate(400, 520)">
    <rect x="-180" y="0" width="360" height="40" rx="20" fill="#f5f5f4"></rect>
    <text x="0" y="22" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#0a0a0a">
      각 재료(변수)가 결과에 미치는 영향이 명확히 공개됩니다.
    </text>
  </g>

  <!-- 연결선 (흐름) -->
  <path d="M 480,300 L 580,300" stroke="#e5e5e5" stroke-width="2" stroke-dasharray="4 4" fill="none"></path>
  <polygon points="580,300 570,295 570,305" fill="#e5e5e5"></polygon>
</svg>