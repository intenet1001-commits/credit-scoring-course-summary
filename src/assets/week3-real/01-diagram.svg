<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>
  
  <!-- 제목 -->
  <text x="400" y="44" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">행동 데이터 기반 신용 점수 시뮬레이션</text>
  <text x="400" y="76" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">일상의 선택이 금융 신뢰도의 '신호'가 됩니다</text>

  <!-- 도시 배경 요소 (도로) -->
  <line x1="40" y1="520" x2="760" y2="520" stroke="#e5e5e5" stroke-width="4" stroke-linecap="round"></line>
  
  <!-- 장소 아이콘 그룹 -->
  <g font-family="'Pretendard', sans-serif" font-size="14" font-weight="500">
    <!-- 직장 -->
    <g transform="translate(220, 420)">
      <rect x="-40" y="-60" width="80" height="60" fill="#f5f5f4" stroke="#737373" stroke-width="2"></rect>
      <rect x="-10" y="-40" width="20" height="20" fill="#e5e5e5"></rect>
      <text y="24" fill="#0a0a0a">안정적 직장</text>
    </g>
    
    <!-- 카지노 -->
    <g transform="translate(380, 420)">
      <rect x="-40" y="-60" width="80" height="60" fill="#f5f5f4" stroke="#737373" stroke-width="2"></rect>
      <circle cx="0" cy="-30" r="15" fill="#e11d48" opacity="0.2"></circle>
      <text x="0" y="-25" fill="#e11d48" font-size="20">🎲</text>
      <text y="24" fill="#0a0a0a">고위험 시설</text>
    </g>
    
    <!-- 은행 -->
    <g transform="translate(540, 420)">
      <path d="M-40 0 L0 -60 L40 0 Z" fill="#f5f5f4" stroke="#737373" stroke-width="2"></path>
      <text y="-15" fill="#2563eb" font-weight="700">$</text>
      <text y="24" fill="#0a0a0a">주거래 은행</text>
    </g>
    
    <!-- 사치품 매장 -->
    <g transform="translate(700, 420)">
      <rect x="-30" y="-50" width="60" height="50" fill="#f5f5f4" stroke="#737373" stroke-width="2"></rect>
      <path d="M-15 -50 Q0 -70 15 -50" fill="none" stroke="#737373" stroke-width="2"></path>
      <text y="24" fill="#0a0a0a">과소비 환경</text>
    </g>
  </g>

  <!-- 이동하는 사람 및 신용 점수 미터기 -->
  <g>
    <!-- 이동 애니메이션 -->
    <animateTransform attributeName="transform" type="translate" values="100,480; 220,480; 220,480; 380,480; 380,480; 540,480; 540,480; 700,480; 700,480; 100,480" dur="12s" repeatCount="indefinite" keyTimes="0; 0.15; 0.25; 0.4; 0.5; 0.65; 0.75; 0.9; 0.95; 1"></animateTransform>

    <!-- 사람 아이콘 -->
    <circle cx="0" cy="-20" r="12" fill="#0a0a0a"></circle>
    <path d="M-10 0 L10 0 L5 30 L-5 30 Z" fill="#0a0a0a"></path>
    
    <!-- 신용 점수 미터기 -->
    <g transform="translate(0, -80)">
      <rect x="-50" y="-10" width="100" height="20" rx="10" fill="#e5e5e5"></rect>
      <!-- 점수 바 애니메이션 -->
      <rect x="-50" y="-10" height="20" rx="10" fill="#2563eb">
        <animate attributeName="width" values="50; 85; 85; 30; 30; 95; 95; 60; 60; 50" dur="12s" repeatCount="indefinite" keyTimes="0; 0.15; 0.25; 0.4; 0.5; 0.65; 0.75; 0.9; 0.95; 1"></animate>
      </rect>
      <text y="-25" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#2563eb">신용 점수</text>
    </g>

    <!-- 신호 텍스트 (상승/하락) -->
    <text x="0" y="-120" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" opacity="0">
      + 긍정적 신호
      <animate attributeName="opacity" values="0;0;1;0;0;0;1;0;0;0" dur="12s" repeatCount="indefinite" keyTimes="0; 0.15; 0.2; 0.25; 0.5; 0.65; 0.7; 0.75; 0.95; 1"></animate>
      <animate attributeName="fill" values="#059669" dur="12s" repeatCount="indefinite"></animate>
      <animate attributeName="y" values="-110; -130" dur="12s" repeatCount="indefinite"></animate>
    </text>
    <text x="0" y="-120" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" opacity="0">
      - 위험 신호
      <animate attributeName="opacity" values="0;0;0;0;1;0;0;0;1;0" dur="12s" repeatCount="indefinite" keyTimes="0; 0.4; 0.45; 0.5; 0.55; 0.6; 0.9; 0.95; 1; 1"></animate>
      <animate attributeName="fill" values="#e11d48" dur="12s" repeatCount="indefinite"></animate>
      <animate attributeName="y" values="-110; -130" dur="12s" repeatCount="indefinite"></animate>
    </text>
  </g>

  <!-- 하단 설명 -->
  <rect x="150" y="540" width="500" height="40" rx="20" fill="#f5f5f4"></rect>
  <text x="400" y="560" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">
    금융기관은 사용자의 <tspan fill="#2563eb" font-weight="700">행동 패턴</tspan>을 통해 상환 능력을 예측합니다.
  </text>
</svg>