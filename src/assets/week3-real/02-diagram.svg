<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>
  
  <!-- 제목 -->
  <text x="400" y="44" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">지리적 네트워크 활동 범위와 신용 위험도 시각화</text>
  
  <!-- 중앙 구분선 -->
  <line x1="400" y1="120" x2="400" y2="540" stroke="#e5e5e5" stroke-width="2" stroke-dasharray="8 4"></line>

  <!-- 왼쪽: 고위험군 (폐쇄적 네트워크) -->
  <g id="high-risk-group">
    <text x="200" y="90" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#ea580c">고위험군 (제한적/사적 공간)</text>
    
    <!-- 사적 공간 아이콘 1: 집 -->
    <g transform="translate(200, 220)">
      <path d="M-20,10 L0,-10 L20,10 V30 H-20 Z" fill="#f5f5f4" stroke="#737373" stroke-width="2"></path>
      <text y="45" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">사적 거주지</text>
    </g>
    
    <!-- 사적 공간 아이콘 2: 잠긴 방 -->
    <g transform="translate(200, 400)">
      <rect x="-15" y="0" width="30" height="25" rx="2" fill="#f5f5f4" stroke="#737373" stroke-width="2"></rect>
      <path d="M-10,0 V-10 A10,10 0 0,1 10,-10 V0" fill="none" stroke="#737373" stroke-width="2"></path>
      <text y="40" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">제한적 구역</text>
    </g>

    <!-- 밀집된 노드 및 연결선 -->
    <g stroke="#ea580c" stroke-width="1.5" opacity="0.6">
      <!-- 집 주변 연결 -->
      <line x1="200" y1="230" x2="160" y2="200">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"></animate>
      </line>
      <line x1="200" y1="230" x2="240" y2="200">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"></animate>
      </line>
      <line x1="200" y1="230" x2="150" y2="250">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"></animate>
      </line>
      <line x1="200" y1="230" x2="250" y2="250">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"></animate>
      </line>
      
      <!-- 잠긴 방 주변 연결 -->
      <line x1="200" y1="410" x2="160" y2="380">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"></animate>
      </line>
      <line x1="200" y1="410" x2="240" y2="380">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"></animate>
      </line>
      <line x1="200" y1="410" x2="170" y2="450">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"></animate>
      </line>
    </g>

    <!-- 고정된 노드들 -->
    <circle cx="160" cy="200" r="4" fill="#ea580c"></circle>
    <circle cx="240" cy="200" r="4" fill="#ea580c"></circle>
    <circle cx="150" cy="250" r="4" fill="#ea580c"></circle>
    <circle cx="250" cy="250" r="4" fill="#ea580c"></circle>
    <circle cx="160" cy="380" r="4" fill="#ea580c"></circle>
    <circle cx="240" cy="380" r="4" fill="#ea580c"></circle>
    <circle cx="170" cy="450" r="4" fill="#ea580c"></circle>
  </g>

  <!-- 오른쪽: 저위험군 (확장적 네트워크) -->
  <g id="low-risk-group">
    <text x="600" y="90" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="18" font-weight="700" fill="#2563eb">저위험군 (다양한 공공 공간)</text>
    
    <!-- 공공 공간 아이콘들 -->
    <g transform="translate(600, 180)"> <!-- 사무실 -->
      <rect x="-15" y="-15" width="30" height="30" fill="#f5f5f4" stroke="#737373" stroke-width="2"></rect>
      <rect x="-5" y="-5" width="4" height="4" fill="#737373"></rect>
      <rect x="5" y="-5" width="4" height="4" fill="#737373"></rect>
      <text y="30" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">직장</text>
    </g>
    
    <g transform="translate(500, 350)"> <!-- 카페 -->
      <path d="M-15,-10 H10 V15 H-15 Z M10,-5 Q18,-5 18,2.5 Q18,10 10,10" fill="#f5f5f4" stroke="#737373" stroke-width="2"></path>
      <text y="30" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">카페</text>
    </g>
    
    <g transform="translate(700, 350)"> <!-- 도서관 -->
      <path d="M-15,10 V-10 H15 V10 M0,-10 V10" fill="none" stroke="#737373" stroke-width="2"></path>
      <rect x="-15" y="5" width="30" height="5" fill="#f5f5f4" stroke="#737373" stroke-width="2"></rect>
      <text y="30" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">도서관</text>
    </g>
    
    <g transform="translate(600, 500)"> <!-- 공원 -->
      <circle cx="0" cy="0" r="15" fill="#f5f5f4" stroke="#737373" stroke-width="2"></circle>
      <path d="M0,15 V-5 M-7,5 L0,-5 L7,5" fill="none" stroke="#737373" stroke-width="2"></path>
      <text y="30" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">공원</text>
    </g>

    <!-- 네트워크 경로선 -->
    <g stroke="#e5e5e5" stroke-width="1" fill="none">
      <path id="path1" d="M600,180 L500,350 L600,500 L700,350 Z"></path>
      <path id="path2" d="M600,180 L700,350 L500,350 L600,180"></path>
    </g>

    <!-- 움직이는 노드 (이동성 시각화) -->
    <circle r="5" fill="#2563eb">
      <animateMotion dur="6s" repeatCount="indefinite" path="M600,180 L500,350 L600,500 L700,350 Z"></animateMotion>
    </circle>
    <circle r="5" fill="#2563eb">
      <animateMotion dur="8s" begin="1s" repeatCount="indefinite" path="M700,350 L600,180 L500,350 L600,500 Z"></animateMotion>
    </circle>
    <circle r="5" fill="#2563eb">
      <animateMotion dur="7s" begin="2s" repeatCount="indefinite" path="M500,350 L700,350 L600,180 L600,500 Z"></animateMotion>
    </circle>
    
    <!-- 추가 정적 노드 -->
    <circle cx="550" cy="260" r="4" fill="#2563eb" opacity="0.5"></circle>
    <circle cx="650" cy="260" r="4" fill="#2563eb" opacity="0.5"></circle>
    <circle cx="550" cy="420" r="4" fill="#2563eb" opacity="0.5"></circle>
    <circle cx="650" cy="420" r="4" fill="#2563eb" opacity="0.5"></circle>
  </g>

  <!-- 하단 설명 캡션 -->
  <rect x="100" y="540" width="200" height="30" rx="15" fill="#ea580c" opacity="0.1"></rect>
  <text x="200" y="560" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#ea580c">활동 반경 협소 = 높은 낙인 위험</text>
  
  <rect x="500" y="540" width="200" height="30" rx="15" fill="#2563eb" opacity="0.1"></rect>
  <text x="600" y="560" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#2563eb">활동 반경 광범위 = 낮은 낙인 위험</text>
</svg>