<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="60" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a">전통적 데이터와 대안 정보의 균형</text>

  <!-- 시소 받침대 -->
  <path d="M370 540 L400 480 L430 540 Z" fill="#e5e5e5" stroke="#737373" stroke-width="2"></path>

  <!-- 움직이는 시소 본체 및 요소들 -->
  <g>
    <!-- 시소 판 -->
    <rect x="150" y="475" width="500" height="10" rx="5" fill="#0a0a0a"></rect>
    
    <!-- 왼쪽: 전통적 데이터 (은행, 동전) -->
    <g transform="translate(220, 380)">
      <!-- 은행 아이콘 -->
      <path d="M10 40 L50 40 L50 80 L10 80 Z M10 40 L30 15 L50 40" fill="none" stroke="#737373" stroke-width="3"></path>
      <rect x="25" y="55" width="10" height="25" fill="#737373"></rect>
      <!-- 동전 스택 -->
      <ellipse cx="75" cy="75" rx="15" ry="6" fill="#e5e5e5" stroke="#737373" stroke-width="2"></ellipse>
      <ellipse cx="75" cy="67" rx="15" ry="6" fill="#f5f5f4" stroke="#737373" stroke-width="2"></ellipse>
      <ellipse cx="75" cy="59" rx="15" ry="6" fill="#ffffff" stroke="#737373" stroke-width="2"></ellipse>
      <!-- 라벨 박스 -->
      <rect x="-10" y="100" width="124" height="32" rx="4" fill="#f5f5f4" stroke="#e5e5e5"></rect>
      <text x="52" y="117" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#0a0a0a">전통적 데이터</text>
    </g>

    <!-- 오른쪽: 대안 정보 (스마트폰, 카트, 고지서) -->
    <g transform="translate(480, 380)">
      <!-- 스마트폰 -->
      <g opacity="0">
        <rect x="10" y="30" width="30" height="55" rx="4" fill="none" stroke="#059669" stroke-width="3"></rect>
        <circle cx="25" cy="78" r="2" fill="#059669"></circle>
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze"></animate>
      </g>
      <!-- 쇼핑 카트 -->
      <g opacity="0">
        <path d="M60 45 L70 45 L85 70 L110 70 M75 50 L105 50 L100 65 L82 65" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round"></path>
        <circle cx="85" cy="78" r="3" fill="#059669"></circle>
        <circle cx="105" cy="78" r="3" fill="#059669"></circle>
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"></animate>
      </g>
      <!-- 고지서 -->
      <g opacity="0">
        <rect x="55" y="5" width="35" height="45" fill="none" stroke="#059669" stroke-width="2"></rect>
        <line x1="62" y1="15" x2="83" y2="15" stroke="#059669" stroke-width="2"></line>
        <line x1="62" y1="25" x2="83" y2="25" stroke="#059669" stroke-width="2"></line>
        <line x1="62" y1="35" x2="75" y2="35" stroke="#059669" stroke-width="2"></line>
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3s" fill="freeze"></animate>
      </g>
      <!-- 라벨 박스 -->
      <rect x="0" y="100" width="110" height="32" rx="4" fill="#f5f5f4" stroke="#e5e5e5"></rect>
      <text x="55" y="117" text-anchor="middle" dominant-baseline="middle" font-family="'Pretendard', sans-serif" font-size="15" font-weight="500" fill="#059669">대안 정보</text>
    </g>

    <!-- 시소 기울기 애니메이션 -->
    <animateTransform attributeName="transform" type="rotate" values="-12 400 480; -12 400 480; 0 400 480" keyTimes="0; 0.7; 1" dur="5s" fill="freeze"></animateTransform>
  </g>

  <!-- 가이드 텍스트 -->
  <text x="400" y="570" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373">데이터의 다양성이 확보되며 정보의 가치가 균형을 이룹니다</text>
</svg>