<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="44" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a" text-anchor="middle">신용 평가 모델의 진화 과정</text>

  <!-- 타임라인 화살표 1 -->
  <g transform="translate(250, 310)">
    <path d="M 0 0 L 60 0" stroke="#e5e5e5" stroke-width="4" fill="none"></path>
    <path d="M 50 -10 L 65 0 L 50 10" stroke="#e5e5e5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  <!-- 타임라인 화살표 2 -->
  <g transform="translate(490, 310)">
    <path d="M 0 0 L 60 0" stroke="#e5e5e5" stroke-width="4" fill="none"></path>
    <path d="M 50 -10 L 65 0 L 50 10" stroke="#e5e5e5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  <!-- 1단계: 주관적 판단 (고대 두루마리) -->
  <g transform="translate(145, 310)">
    <!-- 두루마리 본체 -->
    <path d="M -50 -70 C -70 -70, -70 -30, -50 -30 L 50 -30 C 70 -30, 70 -70, 50 -70 Z" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"></path>
    <rect x="-50" y="-30" width="100" height="120" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"></rect>
    <path d="M -50 90 C -70 90, -70 130, -50 130 L 50 130 C 70 130, 70 90, 50 90 Z" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"></path>
    
    <!-- 체크 표시 애니메이션 -->
    <path id="checkmark" d="M -20 40 L -5 55 L 25 25" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;0;0;100" dur="4s" repeatCount="indefinite" begin="0s"></animate>
    </path>
    
    <text y="160" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#0a0a0a" text-anchor="middle">주관적 판단</text>
    <text y="185" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373" text-anchor="middle">전통적 방식</text>
  </g>

  <!-- 2단계: 통계적 모델 (계산기 및 서류) -->
  <g transform="translate(400, 310)">
    <!-- 서류 더미 -->
    <rect x="-45" y="-55" width="70" height="90" fill="#f5f5f4" stroke="#737373" stroke-width="1"></rect>
    <rect x="-40" y="-50" width="70" height="90" fill="#f5f5f4" stroke="#737373" stroke-width="1"></rect>
    <rect x="-35" y="-45" width="70" height="90" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"></rect>
    <line x1="-25" y1="-25" x2="25" y2="-25" stroke="#e5e5e5" stroke-width="2"></line>
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#e5e5e5" stroke-width="2"></line>
    <line x1="-25" y1="5" x2="5" y2="5" stroke="#e5e5e5" stroke-width="2"></line>

    <!-- 계산기 -->
    <rect x="5" y="20" width="60" height="80" rx="4" fill="#0a0a0a"></rect>
    <rect x="12" y="28" width="46" height="15" rx="2" fill="#e5e5e5"></rect>
    <!-- 계산기 화면 깜빡임 -->
    <text x="35" y="37" font-family="monospace" font-size="10" fill="#059669" text-anchor="middle">
      850
      <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite"></animate>
    </text>
    <!-- 버튼들 -->
    <g fill="#737373">
      <rect x="12" y="50" width="10" height="8" rx="1"></rect>
      <rect x="25" y="50" width="10" height="8" rx="1"></rect>
      <rect x="38" y="50" width="10" height="8" rx="1"></rect>
      <rect x="12" y="62" width="10" height="8" rx="1"></rect>
      <rect x="25" y="62" width="10" height="8" rx="1"></rect>
      <rect x="38" y="62" width="10" height="8" rx="1"></rect>
      <rect x="12" y="74" width="36" height="8" rx="1" fill="#059669"></rect>
    </g>

    <text y="160" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#0a0a0a" text-anchor="middle">표준화 및 객관화</text>
    <text y="185" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373" text-anchor="middle">통계적 스코어링</text>
  </g>

  <!-- 3단계: AI 모델 (빛나는 뇌와 데이터망) -->
  <g transform="translate(655, 310)">
    <!-- 데이터 연결망 -->
    <g stroke="#e5e5e5" stroke-width="1">
      <line x1="0" y1="0" x2="-60" y2="-50"></line>
      <line x1="0" y1="0" x2="60" y2="-40"></line>
      <line x1="0" y1="0" x2="50" y2="60"></line>
      <line x1="0" y1="0" x2="-50" y2="70"></line>
    </g>
    
    <!-- 데이터 포인트 애니메이션 -->
    <circle cx="-60" cy="-50" r="4" fill="#059669">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="60" cy="-40" r="4" fill="#059669">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="0.5s"></animate>
    </circle>
    <circle cx="50" cy="60" r="4" fill="#059669">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="1s"></animate>
    </circle>
    <circle cx="-50" cy="70" r="4" fill="#059669">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="1.5s"></animate>
    </circle>

    <!-- 뇌 아이콘 -->
    <path d="M -30 0 C -30 -40, 30 -40, 30 0 C 30 30, 10 40, 0 40 C -10 40, -30 30, -30 0" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"></path>
    <path d="M 0 -25 C -15 -25, -20 -10, -20 0 C -20 15, -10 25, 0 25" fill="none" stroke="#e5e5e5" stroke-width="2"></path>
    <text y="5" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" fill="#059669" text-anchor="middle">
      AI
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"></animate>
    </text>

    <!-- 후광 효과 -->
    <circle cx="0" cy="0" r="50" fill="#059669" opacity="0.1">
      <animate attributeName="r" values="45;55;45" dur="3s" repeatCount="indefinite"></animate>
    </circle>

    <text y="160" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#0a0a0a" text-anchor="middle">AI 정밀 평가</text>
    <text y="185" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373" text-anchor="middle">비정형 데이터 활용</text>
  </g>

  <!-- 하단 타임라인 바 -->
  <rect x="40" y="520" width="720" height="4" rx="2" fill="#e5e5e5"></rect>
  <rect x="40" y="520" width="0" height="4" rx="2" fill="#059669">
    <animate attributeName="width" values="0;720" dur="6s" repeatCount="indefinite"></animate>
  </rect>
  <text x="40" y="545" font-family="'Pretendard', sans-serif" font-size="12" fill="#737373" text-anchor="start">과거</text>
  <text x="760" y="545" font-family="'Pretendard', sans-serif" font-size="12" fill="#737373" text-anchor="end">현재 및 미래</text>
</svg>