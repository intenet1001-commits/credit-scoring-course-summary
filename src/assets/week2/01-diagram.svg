<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="44" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a" text-anchor="middle">기업 신용도에 따른 대출 금리 차이</text>

  <!-- 은행 건물 (고정) -->
  <g transform="translate(520, 280)">
    <!-- 건물 본체 -->
    <rect x="0" y="40" width="220" height="200" fill="#f5f5f4" stroke="#0a0a0a" stroke-width="2"></rect>
    <!-- 기둥 -->
    <rect x="20" y="80" width="20" height="160" fill="#e5e5e5" stroke="#0a0a0a" stroke-width="1"></rect>
    <rect x="180" y="80" width="20" height="160" fill="#e5e5e5" stroke="#0a0a0a" stroke-width="1"></rect>
    <rect x="100" y="80" width="20" height="160" fill="#e5e5e5" stroke="#0a0a0a" stroke-width="1"></rect>
    <!-- 지붕 -->
    <path d="M -10 40 L 110 0 L 230 40 Z" fill="#737373" stroke="#0a0a0a" stroke-width="2"></path>
    
    <!-- LOAN 간판 -->
    <rect x="40" y="100" width="140" height="50" rx="4" fill="#e5e5e5" stroke="#0a0a0a" stroke-width="2">
      <animate id="signGreen" attributeName="fill" values="#e5e5e5;#dcfce7;#e5e5e5" dur="4s" begin="2s; 12s" fill="freeze"></animate>
      <animate id="signRed" attributeName="fill" values="#e5e5e5;#fee2e2;#e5e5e5" dur="4s" begin="8s; 18s" fill="freeze"></animate>
    </rect>
    <text x="110" y="125" font-family="'Pretendard', sans-serif" font-size="20" font-weight="700" fill="#737373" text-anchor="middle" dominant-baseline="middle">
      LOAN
      <animate attributeName="fill" values="#737373;#059669;#737373" dur="4s" begin="2s; 12s" fill="freeze"></animate>
      <animate attributeName="fill" values="#737373;#e11d48;#737373" dur="4s" begin="8s; 18s" fill="freeze"></animate>
    </text>
    
    <!-- 금리 표시판 -->
    <g opacity="0">
      <text x="110" y="175" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#059669" text-anchor="middle">금리 3.5% (우대)</text>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2s; 12s" fill="freeze"></animate>
    </g>
    <g opacity="0">
      <text x="110" y="175" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#e11d48" text-anchor="middle">금리 15.0% (위험)</text>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="8s; 18s" fill="freeze"></animate>
    </g>
  </g>

  <!-- 우량 기업 (Company A) -->
  <g opacity="0">
    <g transform="translate(80, 380)">
      <rect x="0" y="0" width="120" height="100" fill="#f5f5f4" stroke="#2563eb" stroke-width="2"></rect>
      <rect x="20" y="20" width="20" height="20" fill="#2563eb" opacity="0.3"></rect>
      <rect x="80" y="20" width="20" height="20" fill="#2563eb" opacity="0.3"></rect>
      <rect x="20" y="60" width="20" height="20" fill="#2563eb" opacity="0.3"></rect>
      <rect x="80" y="60" width="20" height="20" fill="#2563eb" opacity="0.3"></rect>
      <rect x="12" y="110" width="96" height="30" rx="4" fill="#f5f5f4" stroke="#737373"></rect>
      <text x="60" y="125" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle">우량 기업</text>
      
      <!-- 체크 표시 -->
      <path d="M 45 40 L 55 50 L 75 30" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="2s; 12s" fill="freeze"></animate>
      </path>
      
      <animateTransform attributeName="transform" type="translate" from="80 380" to="360 380" dur="2s" begin="0s; 10s" fill="freeze"></animateTransform>
    </g>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" begin="0s; 10s" fill="freeze"></animate>
  </g>

  <!-- 부실 기업 (Company B) -->
  <g opacity="0">
    <g transform="translate(80, 380)">
      <rect x="0" y="0" width="120" height="100" fill="#f5f5f4" stroke="#737373" stroke-width="2"></rect>
      <!-- 균열 표현 -->
      <line x1="10" y1="10" x2="30" y2="40" stroke="#737373" stroke-width="1"></line>
      <line x1="110" y1="60" x2="90" y2="90" stroke="#737373" stroke-width="1"></line>
      <rect x="20" y="20" width="20" height="20" fill="#737373" opacity="0.1"></rect>
      <rect x="80" y="60" width="20" height="20" fill="#737373" opacity="0.1"></rect>
      
      <rect x="12" y="110" width="96" height="30" rx="4" fill="#f5f5f4" stroke="#737373"></rect>
      <text x="60" y="125" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle">부실 기업</text>
      
      <!-- X 표시 -->
      <g opacity="0">
        <line x1="45" y1="30" x2="75" y2="60" stroke="#e11d48" stroke-width="6" stroke-linecap="round"></line>
        <line x1="75" y1="30" x2="45" y2="60" stroke="#e11d48" stroke-width="6" stroke-linecap="round"></line>
        <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="8s; 18s" fill="freeze"></animate>
      </g>
      
      <animateTransform attributeName="transform" type="translate" from="80 380" to="360 380" dur="2s" begin="6s; 16s" fill="freeze"></animateTransform>
    </g>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" begin="5s; 15s" fill="freeze"></animate>
  </g>

  <!-- 바닥선 -->
  <line x1="40" y1="520" x2="760" y2="520" stroke="#e5e5e5" stroke-width="2"></line>
</svg>