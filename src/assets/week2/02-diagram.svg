<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f7f4"></rect>

  <!-- 제목 -->
  <text x="400" y="44" font-family="'Pretendard', sans-serif" font-size="24" font-weight="700" fill="#0a0a0a" text-anchor="middle">데이터의 유형: 정형 데이터 vs 비정형 데이터</text>

  <!-- 정형 데이터 구역 (왼쪽) -->
  <g id="structured-pile" transform="translate(160, 250)">
    <!-- 쌓여있는 보고서들 -->
    <rect x="10" y="20" width="120" height="150" fill="#f5f5f4" stroke="#e5e5e5" stroke-width="2"></rect>
    <rect x="5" y="10" width="120" height="150" fill="#f5f5f4" stroke="#e5e5e5" stroke-width="2"></rect>
    <rect x="0" y="0" width="120" height="150" fill="white" stroke="#737373" stroke-width="2">
      <animate attributeName="stroke" values="#737373;#2563eb;#737373" dur="6s" repeatCount="indefinite" begin="0s"></animate>
    </rect>
    
    <!-- 표 구조 (그리드) -->
    <g stroke="#e5e5e5" stroke-width="1">
      <line x1="10" y1="30" x2="110" y2="30"></line>
      <line x1="10" y1="50" x2="110" y2="50"></line>
      <line x1="10" y1="70" x2="110" y2="70"></line>
      <line x1="10" y1="90" x2="110" y2="90"></line>
      <line x1="40" y1="30" x2="40" y2="140"></line>
      <line x1="80" y1="30" x2="80" y2="140"></line>
    </g>
    
    <text x="60" y="185" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#0a0a0a" text-anchor="middle">정형 데이터</text>
    <text x="60" y="205" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373" text-anchor="middle">재무제표, 스프레드시트</text>
    
    <!-- 하이라이트 효과 -->
    <rect x="-10" y="-10" width="140" height="170" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 4" opacity="0">
      <animate attributeName="opacity" values="1;0;0;0;1" dur="6s" repeatCount="indefinite"></animate>
    </rect>
  </g>

  <!-- 비정형 데이터 구역 (오른쪽) -->
  <g id="unstructured-pile" transform="translate(520, 250)">
    <!-- 신문 조각 (기울어짐) -->
    <rect x="0" y="20" width="100" height="130" fill="white" stroke="#737373" stroke-width="2" transform="rotate(-15, 50, 85)">
      <animate attributeName="stroke" values="#737373;#2563eb;#737373" dur="6s" repeatCount="indefinite" begin="3s"></animate>
    </rect>
    
    <!-- SNS 아이콘 (원형) -->
    <circle cx="90" cy="130" r="25" fill="white" stroke="#737373" stroke-width="2">
      <animate attributeName="stroke" values="#737373;#2563eb;#737373" dur="6s" repeatCount="indefinite" begin="3s"></animate>
    </circle>
    <path d="M 80 130 L 100 130 M 90 120 L 90 140" stroke="#e5e5e5" stroke-width="2"></path>
    
    <!-- 말풍선 -->
    <path d="M 20 40 Q 20 10 60 10 Q 100 10 100 40 Q 100 70 70 70 L 50 90 L 50 70 Q 20 70 20 40" fill="white" stroke="#737373" stroke-width="2">
      <animate attributeName="stroke" values="#737373;#2563eb;#737373" dur="6s" repeatCount="indefinite" begin="3s"></animate>
    </path>
    
    <text x="60" y="185" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#0a0a0a" text-anchor="middle">비정형 데이터</text>
    <text x="60" y="205" font-family="'Pretendard', sans-serif" font-size="14" fill="#737373" text-anchor="middle">뉴스, SNS, 음성</text>

    <!-- 하이라이트 효과 -->
    <rect x="-20" y="-10" width="150" height="170" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" dur="6s" repeatCount="indefinite"></animate>
    </rect>
  </g>

  <!-- 돋보기 애니메이션 -->
  <g id="magnifier">
    <!-- 돋보기 렌즈 -->
    <circle cx="0" cy="0" r="50" fill="rgba(37, 99, 235, 0.05)" stroke="#2563eb" stroke-width="4"></circle>
    <!-- 돋보기 손잡이 -->
    <line x1="35" y1="35" x2="70" y2="70" stroke="#2563eb" stroke-width="8" stroke-linecap="round"></line>
    <!-- 렌즈 반사광 -->
    <path d="M -25 -10 A 30 30 0 0 1 -10 -25" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"></path>
    
    <animateMotion path="M 220 320 L 580 320 L 220 320" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"></animateMotion>
  </g>

  <!-- 하단 설명 -->
  <rect x="150" y="530" width="500" height="40" rx="20" fill="#f5f5f4"></rect>
  <text x="400" y="550" font-family="'Pretendard', sans-serif" font-size="15" fill="#737373" text-anchor="middle">돋보기가 데이터의 구조적 차이를 분석합니다</text>
</svg>